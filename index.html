---
layout: default
---

<section class="hero-section">
    <video class="hero-bg-video" autoplay muted loop playsinline
           poster="{{ '/assets/images/hero-roller-poster.jpg' | relative_url }}">
        <source src="{{ '/assets/videos/hero-roller.webm' | relative_url }}" type="video/webm">
        <source src="{{ '/assets/videos/hero-roller.mp4' | relative_url }}" type="video/mp4">
    </video>
    <div class="hero-bg-overlay"></div>

    <h1 class="hero-title">{{ site.church.name }}</h1>
    <p class="hero-subtitle">{{ site.church.tagline }}</p>

    <div class="hero-service-info">
        <p class="hero-service-time"><strong>Join Us Sundays • 5:00 PM</strong></p>
        <p class="hero-service-location">6600 Black Rail Rd, Carlsbad CA 92011</p>
    </div>

    <div class="hero-buttons">
        <a href="{{ '/plan-your-visit/' | relative_url }}" class="btn btn-primary btn-hero-large">Plan Your Visit</a>
        <a href="{{ '/vision-and-values/' | relative_url }}" class="btn btn-primary btn-hero-large">Vision & Values</a>
    </div>
</section>

{% if site.welcome_video.youtube_id != "" %}
<section class="welcome-video-section">
    <div class="video-responsive">
        <iframe
            src="https://www.youtube-nocookie.com/embed/{{ site.welcome_video.youtube_id }}?rel=0&modestbranding=1"
            title="Welcome to {{ site.church.name }}"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
    </div>
</section>
{% endif %}
