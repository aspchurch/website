---
layout: default
---

<section class="hero-section">
    <video class="hero-bg-video" autoplay muted loop playsinline
           poster="{{ '/assets/images/hero-roller-poster.jpg' | relative_url }}">
        <source src="{{ '/assets/videos/hero-roller.webm' | relative_url }}" type="video/webm">
        <source src="{{ '/assets/videos/hero-roller.mp4' | relative_url }}" type="video/mp4">
    </video>
    <div class="hero-bg-overlay"></div>

    <h1 class="hero-title">{{ site.church.name }}</h1>
    <p class="hero-subtitle">{{ site.church.tagline }}</p>

    <div class="hero-service-info">
        <p class="hero-service-time"><strong>Join Us Sundays • 5:00 PM</strong></p>
        <p class="hero-service-location">6600 Black Rail Rd, Carlsbad CA 92011</p>
    </div>

    <div class="hero-buttons">
        <a href="{{ '/plan-your-visit/' | relative_url }}" class="btn btn-primary btn-hero-large">Plan Your Visit</a>
    </div>
</section>

<section class="welcome-video-section">
    <div class="welcome-video-intro">
        <h2 class="welcome-video-title">A Word From Our Pastor</h2>
    </div>

    <div class="video-responsive video-player" id="welcome-video-player">
        <video id="welcome-video" preload="none" playsinline
               poster="{{ '/assets/images/welcome-video-poster.jpg' | relative_url }}">
            <source src="{{ '/assets/videos/welcome-video.mp4' | relative_url }}" type="video/mp4">
        </video>

        <button type="button" class="video-play-overlay" aria-label="Play video">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <div class="video-controls">
            <button type="button" class="video-btn video-btn-play" aria-label="Play">
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause is-icon-hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>

            <span class="video-time video-time-current">0:00</span>

            <input type="range" class="video-progress" min="0" max="100" value="0" step="0.1" aria-label="Seek">

            <span class="video-time video-time-duration">0:00</span>

            <button type="button" class="video-btn video-btn-mute" aria-label="Mute">
                <svg class="icon-unmuted" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 5V5l-5 5H3z"/><path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v8.06c1.5-.74 2.5-2.26 2.5-4.03z"/><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <svg class="icon-muted is-icon-hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 5V5l-5 5H3z"/><path d="M19.73 21 3 4.27 4.27 3l16.73 16.73z"/><path d="M16.5 12a4.5 4.5 0 0 0-1.09-2.94l1.13 1.13c.09.28.14.58.14.81 0 .35-.06.68-.17.99l1.15 1.15c.28-.65.44-1.36.44-2.14 0-2.19-1.24-4.09-3.05-5.04l1.09 1.09c.87.85 1.36 2.02 1.36 3.35z"/></svg>
            </button>

            <button type="button" class="video-btn video-btn-fullscreen" aria-label="Fullscreen">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
        </div>
    </div>
</section>

<script>
    (function () {
        const player = document.getElementById('welcome-video-player');
        if (!player) return;

        const video = document.getElementById('welcome-video');
        const overlayBtn = player.querySelector('.video-play-overlay');
        const playBtn = player.querySelector('.video-btn-play');
        const muteBtn = player.querySelector('.video-btn-mute');
        const fullscreenBtn = player.querySelector('.video-btn-fullscreen');
        const progress = player.querySelector('.video-progress');
        const currentTimeEl = player.querySelector('.video-time-current');
        const durationEl = player.querySelector('.video-time-duration');

        function formatTime(seconds) {
            if (!isFinite(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return m + ':' + s;
        }

        function setPlayingState(isPlaying) {
            player.classList.toggle('is-playing', isPlaying);
            playBtn.querySelector('.icon-play').classList.toggle('is-icon-hidden', isPlaying);
            playBtn.querySelector('.icon-pause').classList.toggle('is-icon-hidden', !isPlaying);
            playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
            overlayBtn.setAttribute('aria-label', isPlaying ? 'Pause video' : 'Play video');
        }

        function togglePlay() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        overlayBtn.addEventListener('click', togglePlay);
        playBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);
        video.addEventListener('play', function () { setPlayingState(true); });
        video.addEventListener('pause', function () { setPlayingState(false); });
        video.addEventListener('ended', function () { setPlayingState(false); });

        video.addEventListener('loadedmetadata', function () {
            durationEl.textContent = formatTime(video.duration);
        });

        video.addEventListener('timeupdate', function () {
            currentTimeEl.textContent = formatTime(video.currentTime);
            if (video.duration) {
                progress.value = (video.currentTime / video.duration) * 100;
            }
        });

        progress.addEventListener('input', function () {
            if (video.duration) {
                video.currentTime = (progress.value / 100) * video.duration;
            }
        });

        muteBtn.addEventListener('click', function () {
            video.muted = !video.muted;
            muteBtn.querySelector('.icon-unmuted').classList.toggle('is-icon-hidden', video.muted);
            muteBtn.querySelector('.icon-muted').classList.toggle('is-icon-hidden', !video.muted);
            muteBtn.setAttribute('aria-label', video.muted ? 'Unmute' : 'Mute');
        });

        fullscreenBtn.addEventListener('click', function () {
            if (player.requestFullscreen) {
                player.requestFullscreen();
            } else if (player.webkitRequestFullscreen) {
                player.webkitRequestFullscreen();
            }
        });
    })();
</script>
