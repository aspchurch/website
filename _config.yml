# Site settings
title: "All Saints Presbyterian Church"
description: "We exist to be a church and a people formed by the gospel of Jesus Christ"
#description: "A new church plant serving North County San Diego"
url: "https://www.aspchurch.com"
baseurl: ""

# Church information
church:
  name: "All Saints Presbyterian Church"
  tagline: "We exist to be a church and a people formed by the gospel of Jesus Christ"
  location: "Carlsbad, North County San Diego"
  email: "info@aspchurch.com"
  phone: "(760) 385-8296"           # Display format — keep in sync with phone_e164
  phone_e164: "+17603858296"        # E.164 format for schema/tel: links
  instagram: "https://www.instagram.com/allsaintspresbyterianchurch/"
  lat: 33.1131188   # Coordinates — keep in sync with service.yml map_embed
  lng: -117.2872516
  google_maps_url: "https://www.google.com/maps/place/All+Saints+Presbyterian+Church/@33.1131188,-117.2872516,17z/data=!3m1!4b1!4m6!3m5!1s0x80dc73c2a9c0054b:0x3deed9dbd5072620!8m2!3d33.1131188!4d-117.2872516!16s%2Fg%2F11z0vbw63z"

# "Let Us Know You're Coming" visit form (Plan Your Visit page)
# Powered by Web3Forms (https://web3forms.com) — a free, no-backend form service.
# 1. Get an access key by submitting your email at https://web3forms.com
# 2. Paste it below. The key is public (it ships in the page HTML) — that's expected.
# 3. Submissions email to whatever address owns that access key. To notify multiple
#    people, point it at a forwarding group (e.g. visits@aspchurch.com) instead of a
#    single inbox — see README.md for details.
forms:
  web3forms_access_key: 3023444e-56ac-4a05-97a2-74c8b46f5d74

# Performance & Optimization Settings
# Set to false during development, true for production
performance:
  enable_service_worker: false     # Enables offline caching
  enable_css_cache_busting: false  # Adds timestamps to CSS files
  enable_image_optimization: false # Use optimized WebP images
  enable_preload_optimization: true # Keep critical resource preloading

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# No layout on this site renders `page.excerpt`, but Jekyll still computes one for
# every page at build time. The default separator ("\n\n", a blank line) can land
# mid-Liquid-block on pages built from {% for %} loops (e.g. leadership.md), which
# triggers a "Excerpt modified" warning. Point it at a marker that never appears in
# content so no cut point is ever found.
excerpt_separator: "<!--more-->"

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# GitHub Pages configuration
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude files from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - doc/
  - Makefile
  - "*.sh"
  - sw.js.production

# Collections (for future content organization)
collections:
  pages:
    output: true
    permalink: /:name/

# Development settings to disable caching
incremental: false
regenerate: true

# Default layouts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
    values:
      layout: "default"