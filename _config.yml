# Site settings
title: "All Saints Presbyterian Church"
description: "We exist to be a church and a people formed by the gospel of Jesus Christ"
#description: "A new church plant serving North County San Diego"
url: "https://www.aspchurch.com"
baseurl: ""

# Church information
church:
  name: "All Saints Presbyterian Church"
  tagline: "We exist to be a church and a people formed by the gospel of Jesus Christ"
  location: "Carlsbad, North County San Diego"
  email: "info@aspchurch.com"
  phone: "(760) 385-8296"           # Display format — keep in sync with phone_e164
  phone_e164: "+17603858296"        # E.164 format for schema/tel: links
  instagram: "https://www.instagram.com/allsaintspresbyterianchurch/"

# Performance & Optimization Settings
# Set to false during development, true for production
performance:
  enable_service_worker: false     # Enables offline caching
  enable_css_cache_busting: false  # Adds timestamps to CSS files
  enable_image_optimization: false # Use optimized WebP images
  enable_preload_optimization: true # Keep critical resource preloading

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# GitHub Pages configuration
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude files from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - doc/
  - Makefile
  - "*.sh"
  - sw.js.production

# Collections (for future content organization)
collections:
  pages:
    output: true
    permalink: /:name/

# Development settings to disable caching
incremental: false
regenerate: true

# Default layouts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
    values:
      layout: "default"