---
layout: default
---

{% if page.title %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "{{ site.url }}{{ site.baseurl }}/"
        },
        {
            "@type": "ListItem",
            "position": 2,
            "name": "{{ page.title }}",
            "item": "{{ page.url | absolute_url }}"
        }
    ]
}
</script>
{% endif %}

{% if page.title %}
<section class="page-hero">
    <div class="page-hero-content">
        <h1 class="page-hero-title">{{ page.title }}</h1>
        {% if page.subtitle %}
        <p class="page-hero-subtitle">{{ page.subtitle }}</p>
        {% endif %}
    </div>
</section>
{% endif %}

<div class="page-content">
    <div class="page-body">
        {{ content }}
    </div>
</div>
